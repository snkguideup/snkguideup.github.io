<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ব্লগ - SNK Ai Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="manifest" href="../manifest.json">
<style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#eef0f2;--navy:#14213d;--yellow:#ffc72c}
    [data-theme="dark"]{--bg:#0b1220;--card:#0f172a;--text:#e5e7eb;--muted:#9ca3af;--line:#1f2937}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Hind Siliguri",sans-serif;background:var(--bg);color:var(--text)}
    a{text-decoration:none;color:inherit}
    .top{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .top img{height:34px}.top b{font-size:18px}.top .sp{flex:1}
    .top a,.top button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:8px 16px;font:600 13px "Hind Siliguri";cursor:pointer}
    .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    h1{font-size:28px;margin-bottom:6px}.sub{color:var(--muted);margin-bottom:20px}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
    .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 18px;border-radius:999px;font:600 13px "Hind Siliguri";cursor:pointer}
    .tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .post{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s;display:block}
    .post:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
    .cover{height:120px;background:linear-gradient(135deg,#14213d,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:48px}
    .pb{padding:16px}.cat{font-size:12px;font-weight:700;color:#b45309;background:#fef3c7;padding:3px 10px;border-radius:999px;display:inline-block;margin-bottom:8px}
    .pb h3{font-size:17px;line-height:1.4;margin-bottom:6px}.pb p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px}
    .meta{font-size:12px;color:var(--muted)}
    @media(max-width:860px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><img src="https://raw.githubusercontent.com/snkguideup/snkguideup.github.io/main/logo.svg" alt="SNK"><b>SNK Ai Academy</b><span class="sp"></span><a href="../index.html">🏠 হোম</a><a href="../blogs/">📝 ব্লগ</a><button id="themeBtn" type="button">🌙</button></div>
<div class="wrap"><h1>📝 SNK ব্লগ</h1><p class="sub">টিপস, গাইড আর ক্যারিয়ার পরামর্শ</p>
<div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="empty" id="msg">লোড হচ্ছে...</div></div>
<script type="module">
// ⚠️ Firebase ভার্সন (10.12.2) আপনার firebase-config.js এর সাথে মিলিয়ে নিন
import { db } from "../firebase-config.js";
import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const themeBtn=document.getElementById("themeBtn");function applyTheme(t){document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"");themeBtn.textContent=t==="dark"?"☀️":"🌙"}applyTheme(localStorage.getItem("snk-theme")||"light");themeBtn.onclick=()=>{const n=localStorage.getItem("snk-theme")==="dark"?"light":"dark";localStorage.setItem("snk-theme",n);applyTheme(n)};
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const dOf=x=>{const t=x.createdAt;return t&&t.toDate?t.toDate():(t?new Date(t):null)};const fmt=d=>d?bn(d.toLocaleDateString("en-GB")):"";const mins=t=>Math.max(1,Math.round(String(t||"").split(/\s+/).length/150));
let posts=[],cat="সব";
function render(){
  const cats=["সব",...new Set(posts.map(p=>p.category).filter(Boolean))];
  document.getElementById("tabs").innerHTML=cats.map(c=>'<button class="tab '+(c===cat?"on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cat=b.dataset.c;render()});
  const list=posts.filter(p=>cat==="সব"||p.category===cat);
  document.getElementById("grid").innerHTML=list.map(p=>'<a class="post" href="post/?id='+encodeURIComponent(p.id)+'"><div class="cover">'+esc(p.emoji||"📝")+'</div><div class="pb">'+(p.category?'<span class="cat">'+esc(p.category)+'</span>':"")+'<h3>'+esc(p.title)+'</h3><p>'+esc(p.excerpt||"")+'</p><div class="meta">'+fmt(dOf(p))+' · '+bn(mins(p.body))+' মিনিট পড়া</div></div></a>').join("");
  const m=document.getElementById("msg");m.style.display=list.length?"none":"block";
}
try{
  const s=await getDocs(query(collection(db,"posts"),where("published","==",true)));
  posts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(dOf(b)||0)-(dOf(a)||0));
  document.getElementById("msg").textContent="এখনো কোনো পোস্ট নেই।";
}catch(e){console.warn(e);document.getElementById("msg").textContent="পোস্ট লোড করা যায়নি (Rules যাচাই করুন)।";}
render();
</script></body></html>
