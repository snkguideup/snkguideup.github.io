<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ব্লগ পোস্ট - SNK Ai Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="manifest" href="../../manifest.json">
<style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#eef0f2;--navy:#14213d;--yellow:#ffc72c}
    [data-theme="dark"]{--bg:#0b1220;--card:#0f172a;--text:#e5e7eb;--muted:#9ca3af;--line:#1f2937}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Hind Siliguri",sans-serif;background:var(--bg);color:var(--text)}
    a{text-decoration:none;color:inherit}
    .top{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .top img{height:34px}.top b{font-size:18px}.top .sp{flex:1}
    .top a,.top button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:8px 16px;font:600 13px "Hind Siliguri";cursor:pointer}
    .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    article{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px}
    .cat{font-size:12px;font-weight:700;color:#b45309;background:#fef3c7;padding:3px 10px;border-radius:999px}
    h1{font-size:30px;line-height:1.35;margin:12px 0 8px}.meta{font-size:13px;color:var(--muted);margin-bottom:24px}
    .body p{font-size:17px;line-height:1.9;margin-bottom:18px}
    .back{display:inline-block;margin-bottom:16px;font-weight:700;color:#d97706}
</style></head><body>
<div class="top"><img src="https://raw.githubusercontent.com/snkguideup/snkguideup.github.io/main/logo.svg" alt="SNK"><b>SNK Ai Academy</b><span class="sp"></span><a href="../../index.html">🏠 হোম</a><a href="../../blogs/">📝 ব্লগ</a><button id="themeBtn" type="button">🌙</button></div>
<div class="wrap"><a class="back" href="../">← সব পোস্ট</a>
<article id="art" style="display:none"><span class="cat" id="cat"></span><h1 id="ttl"></h1><div class="meta" id="meta"></div><div class="body" id="body"></div></article>
<div class="empty" id="msg">লোড হচ্ছে...</div></div>
<script type="module">
// ⚠️ Firebase ভার্সন (10.12.2) আপনার firebase-config.js এর সাথে মিলিয়ে নিন
import { db } from "../../firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const themeBtn=document.getElementById("themeBtn");function applyTheme(t){document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"");themeBtn.textContent=t==="dark"?"☀️":"🌙"}applyTheme(localStorage.getItem("snk-theme")||"light");themeBtn.onclick=()=>{const n=localStorage.getItem("snk-theme")==="dark"?"light":"dark";localStorage.setItem("snk-theme",n);applyTheme(n)};
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const dOf=x=>{const t=x.createdAt;return t&&t.toDate?t.toDate():(t?new Date(t):null)};const fmt=d=>d?bn(d.toLocaleDateString("en-GB")):"";const mins=t=>Math.max(1,Math.round(String(t||"").split(/\s+/).length/150));
const id=new URLSearchParams(location.search).get("id");
try{
  const s=id?await getDoc(doc(db,"posts",id)):null;
  if(!s||!s.exists()||s.data().published!==true) throw new Error("none");
  const p=s.data();
  document.title=p.title+" - SNK Ai Academy";
  document.getElementById("cat").textContent=p.category||"ব্লগ";
  document.getElementById("ttl").textContent=(p.emoji?p.emoji+" ":"")+p.title;
  document.getElementById("meta").textContent=(p.author?"লেখক: "+p.author+" · ":"")+fmt(dOf(p))+" · "+bn(mins(p.body))+" মিনিট পড়া";
  document.getElementById("body").innerHTML=String(p.body||"").split(/\n\s*\n/).map(x=>"<p>"+esc(x).replace(/\n/g,"<br>")+"</p>").join("");
  document.getElementById("art").style.display="block";document.getElementById("msg").style.display="none";
}catch(e){document.getElementById("msg").textContent="পোস্টটি পাওয়া যায়নি।"}
</script></body></html>
