<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<script>try{if(localStorage.getItem("snk-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<script type="module" src="../../role-guard.js"></script>
<title>ডাটা এক্সপোর্ট - SNK Admin</title>
<style>
.w{max-width:820px;margin:0 auto;padding:28px 20px 60px}
.top h1{font-size:25px;font-weight:800;margin-bottom:6px}
.sub{color:#6b7280;font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{border:1px solid #eef0f2;border-radius:16px;padding:20px}
.card h2{font-size:17px;margin-bottom:6px}.card p{font-size:13px;color:#6b7280;margin-bottom:14px;min-height:36px}
.card button{padding:11px 22px;border:none;border-radius:999px;background:#ffc72c;font-weight:800;font-family:inherit;font-size:14px;cursor:pointer}
.card button:disabled{opacity:.6;cursor:wait}
.msg{font-size:13px;font-weight:600;margin-top:10px;min-height:18px}.ok{color:#16a34a}.bad{color:#b91c1c}
.warn{background:#fee2e2;color:#b91c1c;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:22px}
[data-theme="dark"] .card{border-color:#1f2937}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="w">
  <div class="top"><h1>📥 ডাটা এক্সপোর্ট (Excel / CSV)</h1></div>
  <p class="sub">বাটন চাপলে ফাইল ডাউনলোড হবে। Excel বা Google Sheets এ খুললে বাংলা লেখা ঠিকঠাক দেখাবে।</p>
  <div class="grid" id="grid"></div>
  <div class="warn">⚠️ এই ফাইলে স্টুডেন্টদের ইমেইল, ফোন ও পেমেন্টের তথ্য থাকে। ফাইল নিরাপদে রাখুন, অন্য কাউকে পাঠাবেন না।</div>
</div>
<script type="module">
import { db } from "../../firebase-config.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const SETS = [
  { name: "orders", title: "💳 অর্ডার ও পেমেন্ট", desc: "সব অর্ডার: কোর্স, পরিমাণ, TrxID, স্ট্যাটাস, তারিখ" },
  { name: "users", title: "👥 ইউজার তালিকা", desc: "নাম, ইমেইল, রোল ও যোগ দেওয়ার তারিখ" },
  { name: "enrollments", title: "🎓 এনরোলমেন্ট", desc: "কোন স্টুডেন্ট কোন কোর্সে, সিজন-২ অ্যাক্সেস সহ" },
  { name: "reviews", title: "⭐ রিভিউ", desc: "রেটিং, লেখা ও অনুমোদনের অবস্থা" },
  { name: "certificates", title: "📜 সার্টিফিকেট", desc: "কাকে কোন কোর্সের সার্টিফিকেট দেওয়া হয়েছে" },
  { name: "courses", title: "📚 কোর্স", desc: "সব কোর্সের তথ্য" }
];

const cell = v => {
  if (v === null || v === undefined) return "";
  if (typeof v === "object") {
    if (typeof v.toDate === "function") { const d = v.toDate(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
    try { return JSON.stringify(v); } catch (e) { return ""; }
  }
  let s = String(v);
  if (/^[=+\-@]/.test(s)) s = "'" + s;           // Excel ফর্মুলা ইনজেকশন ঠেকাতে
  return s;
};
const q = s => '"' + String(s).replace(/"/g, '""') + '"';

async function exportSet(set, btn, msg) {
  btn.disabled = true; msg.className = "msg"; msg.textContent = "লোড হচ্ছে…";
  try {
    const rows = (await getDocs(collection(db, set.name))).docs.map(d => ({ id: d.id, ...d.data() }));
    if (!rows.length) { msg.className = "msg bad"; msg.textContent = "কোনো ডাটা নেই"; return; }
    const keys = ["id"]; rows.forEach(r => Object.keys(r).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
    const lines = [keys.map(q).join(",")].concat(rows.map(r => keys.map(k => q(cell(r[k]))).join(",")));
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "snk-" + set.name + "-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    msg.className = "msg ok"; msg.textContent = "✅ " + rows.length + "টি সারি ডাউনলোড হয়েছে";
  } catch (e) { msg.className = "msg bad"; msg.textContent = "ব্যর্থ: " + e.message; }
  finally { btn.disabled = false; }
}

const grid = document.getElementById("grid");
SETS.forEach(set => {
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = "<h2></h2><p></p><button type='button'>⬇️ CSV ডাউনলোড</button><div class='msg'></div>";
  c.querySelector("h2").textContent = set.title; c.querySelector("p").textContent = set.desc;
  const btn = c.querySelector("button"), msg = c.querySelector(".msg");
  btn.addEventListener("click", () => exportSet(set, btn, msg));
  grid.appendChild(c);
});
</script></body></html>
