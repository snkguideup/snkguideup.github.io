<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<script>try{if(localStorage.getItem("snk-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<script type="module" src="../../role-guard.js"></script>
<title>রিভিউ ম্যানেজ - SNK Admin</title>
<style>
.w{max-width:900px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.top h1{font-size:25px;font-weight:800}.top a{padding:9px 16px;border-radius:999px;background:#ffc72c;font-weight:700;font-size:13px}
.card{border:1px solid #eef0f2;border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card .st{color:#f59e0b;letter-spacing:2px}.card p{font-size:14px;margin:6px 0}.card small{color:#6b7280}
.tag{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;margin-left:8px}
.pending{background:#fef3c7;color:#b45309}.approved{background:#dcfce7;color:#16a34a}
.act button{margin-right:8px;margin-top:8px;padding:8px 16px;border:none;border-radius:999px;font-weight:700;font-family:inherit;cursor:pointer}
.ap{background:#16a34a;color:#fff}.rm{background:#fee2e2;color:#b91c1c}
h2{font-size:17px;margin:20px 0 10px}.err{color:#b91c1c;font-size:13px}
[data-theme="dark"] .card{border-color:#1f2937}
</style></head><body>
<div class="w">
  <div class="top"><h1>⭐ রিভিউ ম্যানেজ</h1><a href="../stats/">📊 পরিসংখ্যান</a></div>
  <div id="err" class="err"></div>
  <h2>⏳ অনুমোদনের অপেক্ষায়</h2><div id="pending">লোড হচ্ছে…</div>
  <h2>✅ প্রকাশিত রিভিউ</h2><div id="approved"></div>
</div>
<script type="module">
import { db } from "../../firebase-config.js";
import { collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let courses = {};
async function load() {
  try {
    try { (await getDocs(collection(db, "courses"))).docs.forEach(d => courses[d.id] = d.data().title || d.data().name || d.id); } catch (e) {}
    const all = (await getDocs(collection(db, "reviews"))).docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0));
    const row = r => '<div class="card"><span class="st">' + "★".repeat(r.rating) + "☆".repeat(5 - r.rating) + '</span><span class="tag ' + r.status + '">' + r.status + '</span>' +
      '<p>' + esc(r.text) + '</p><small>' + esc(r.name) + ' · ' + esc(courses[r.courseId] || r.courseId) + '</small>' +
      '<div class="act">' + (r.status !== "approved" ? '<button class="ap" data-a="ok" data-id="' + esc(r.id) + '">✅ অনুমোদন</button>' : '') +
      '<button class="rm" data-a="del" data-id="' + esc(r.id) + '">🗑️ মুছুন</button></div></div>';
    const p = all.filter(r => r.status !== "approved"), a = all.filter(r => r.status === "approved");
    document.getElementById("pending").innerHTML = p.map(row).join("") || "কোনো পেন্ডিং রিভিউ নেই।";
    document.getElementById("approved").innerHTML = a.map(row).join("") || "এখনো কিছু নেই।";
  } catch (e) { document.getElementById("err").textContent = "লোড হয়নি: " + e.message + " (rules চেক করুন)"; document.getElementById("pending").textContent = ""; }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  try {
    if (b.dataset.a === "ok") await updateDoc(doc(db, "reviews", b.dataset.id), { status: "approved" });
    else if (confirm("রিভিউটি মুছে ফেলবেন?")) await deleteDoc(doc(db, "reviews", b.dataset.id));
    load();
  } catch (err) { document.getElementById("err").textContent = "ব্যর্থ: " + err.message; }
});
load();
</script></body></html>
