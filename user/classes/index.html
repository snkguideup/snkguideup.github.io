<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../style.css"><script>try{if(localStorage.getItem("snk-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script><script type="module" src="../../role-guard.js"></script><title>আমার ক্লাস ও সার্টিফিকেট - SNK Ai Academy</title>
<style>
.w{max-width:900px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.top h1{font-size:25px;font-weight:800}.top a{padding:9px 16px;border-radius:999px;background:#f3f4f6;font-weight:700;font-size:13px}
.card{border:1px solid #eef0f2;border-radius:16px;padding:20px;margin-bottom:16px}
.card h3{font-size:17px;margin-bottom:6px}.card p{font-size:13px;color:#6b7280;margin-bottom:12px}
.b{display:inline-block;padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;margin-right:8px;margin-top:4px}
.y{background:#ffc72c;color:#111827}.n{background:#14213d;color:#fff}
.empty{text-align:center;color:#6b7280;padding:40px 0}
[data-theme="dark"] .card{border-color:#1f2937}[data-theme="dark"] .top a{background:#1f2937;color:#e5e7eb}
</style></head><body>
<div class="w">
  <div class="top"><h1>🎥 আমার ক্লাস ও সার্টিফিকেট</h1><a href="../">← ড্যাশবোর্ড</a></div>
  <div id="list"><div class="empty">লোড হচ্ছে…</div></div>
</div>
<script type="module">
import { auth, db } from "../../firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = document.getElementById("list");
onAuthStateChanged(auth, async user => {
  if (!user) return;
  try {
    const courses = (await getDocs(collection(db, "courses"))).docs.map(d => ({ id: d.id, ...d.data() }));
    let html = "";
    for (const c of courses) {
      const key = user.uid + "_" + c.id;
      let enrolled = false, cert = false;
      try { enrolled = (await getDoc(doc(db, "enrollments", key))).exists(); } catch (e) {}
      try { cert = (await getDoc(doc(db, "certificates", key))).exists(); } catch (e) {}
      if (!enrolled && !cert) continue;
      const link = c.liveLink && /^https?:\/\//.test(c.liveLink) ? c.liveLink : "";
      html += '<div class="card"><h3>' + esc(c.title || c.name || c.id) + '</h3><p>' +
        (c.liveTime ? "🕐 " + esc(c.liveTime) : "ক্লাসের সময় এখনো দেওয়া হয়নি") + '</p>' +
        (link ? '<a class="b y" target="_blank" rel="noopener" href="' + esc(link) + '">🎥 লাইভ ক্লাসে যোগ দিন</a>' : '<span class="b" style="background:#f3f4f6">লাইভ লিংক শীঘ্রই আসছে</span>') +
        (cert ? '<a class="b n" href="../certificate/?id=' + encodeURIComponent(c.id) + '">🎓 সার্টিফিকেট দেখুন</a>' : '') + '</div>';
    }
    list.innerHTML = html || '<div class="empty">আপনি এখনো কোনো কোর্সে এনরোল করেননি।</div>';
  } catch (e) { list.innerHTML = '<div class="empty">লোড করা যায়নি: ' + esc(e.message) + '</div>'; }
});
</script></body></html>
