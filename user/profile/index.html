<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
<script>try{if(localStorage.getItem("snk-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<script type="module" src="../../role-guard.js"></script>
<title>আমার প্রোফাইল - SNK Ai Academy</title>
<style>
.w{max-width:560px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.top h1{font-size:25px;font-weight:800}.top a{padding:9px 16px;border-radius:999px;background:#f3f4f6;font-weight:700;font-size:13px}
.box{border:1px solid #eef0f2;border-radius:16px;padding:24px}
.av{width:76px;height:76px;border-radius:50%;background:#ffc72c;color:#111827;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
input{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px;font-family:inherit;font-size:14px;background:#fff;color:#111827}
input[readonly]{background:#f3f4f6;color:#6b7280}
.hint{font-size:12px;color:#6b7280;margin-top:4px}
button.go{margin-top:20px;width:100%;padding:13px;border:none;border-radius:999px;background:#ffc72c;font-weight:800;font-family:inherit;font-size:15px;cursor:pointer}
.msg{margin-top:12px;font-size:13px;font-weight:600;text-align:center}.ok{color:#16a34a}.bad{color:#b91c1c}
[data-theme="dark"] .box{border-color:#1f2937}[data-theme="dark"] .top a{background:#1f2937;color:#e5e7eb}
[data-theme="dark"] input[readonly]{background:#1f2937;color:#9ca3af}
</style></head><body>
<div class="w">
  <div class="top"><h1>👤 আমার প্রোফাইল</h1><a href="../">← ড্যাশবোর্ড</a></div>
  <div class="box">
    <div class="av" id="av">?</div>
    <label>ইমেইল</label><input id="email" readonly>
    <label>পুরো নাম</label><input id="name" maxlength="60" placeholder="আপনার নাম">
    <div class="hint">⚠️ সার্টিফিকেটে এই নামই ছাপা হবে, তাই সঠিক নাম লিখুন।</div>
    <label>মোবাইল নম্বর</label><input id="phone" maxlength="20" inputmode="tel" placeholder="01XXXXXXXXX">
    <button class="go" id="save">💾 সেভ করুন</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script type="module">
import { auth, db } from "../../firebase-config.js";
import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $ = id => document.getElementById(id);
const say = (t, ok) => { $("msg").className = "msg " + (ok ? "ok" : "bad"); $("msg").textContent = t; };
const initial = n => (n || "?").trim().charAt(0).toUpperCase() || "?";

onAuthStateChanged(auth, async user => {
  if (!user) return;
  $("email").value = user.email || "";
  const ref = doc(db, "users", user.uid);
  try {
    const s = await getDoc(ref), d = s.exists() ? s.data() : {};
    $("name").value = d.name || user.displayName || "";
    $("phone").value = d.phone || "";
    $("av").textContent = initial($("name").value || user.email);
  } catch (e) { say("তথ্য পড়া যায়নি: " + e.message, false); }

  $("name").addEventListener("input", () => { $("av").textContent = initial($("name").value || user.email); });

  $("save").addEventListener("click", async () => {
    const name = $("name").value.trim(), phone = $("phone").value.trim();
    if (name.length < 2) return say("নাম কমপক্ষে ২ অক্ষরের দিন।", false);
    if (phone && !/^\+?[0-9]{8,15}$/.test(phone.replace(/[\s-]/g, ""))) return say("মোবাইল নম্বর ঠিক নয়।", false);
    try {
      await updateDoc(ref, { name, phone: phone.replace(/[\s-]/g, ""), updatedAt: serverTimestamp() });
      try { await updateProfile(user, { displayName: name }); } catch (e) {}
      say("✅ প্রোফাইল সেভ হয়েছে।", true);
    } catch (e) { say("সেভ হয়নি: " + e.message + " (Firestore rules চেক করুন)", false); }
  });
});
</script></body></html>
